name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    # This job only runs if it's a push to main (not for PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        # ATENÇÃO: Você precisa configurar essas secrets no seu repositório do GitHub (Settings > Secrets and variables > Actions)
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # Substitua 'seu-usuario-dockerhub' pelo seu nome de usuário real ou use uma variável
        tags: ${{ secrets.DOCKER_USERNAME }}/devops-projeto-1:latest,${{ secrets.DOCKER_USERNAME }}/devops-projeto-1:${{ github.sha }}
